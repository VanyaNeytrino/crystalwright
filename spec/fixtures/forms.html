<!doctype html>
<html>
  <head><title>forms</title></head>
  <body>
    <input id="text" type="text" value="preset" />
    <input id="email" type="email" />
    <textarea id="area">old text</textarea>
    <div id="editable" contenteditable="true">editable text</div>
    <input id="readonly" type="text" value="fixed" readonly />
    <input id="disabled" type="text" disabled />
    <fieldset disabled>
      <legend><input id="in-legend" type="text" /></legend>
      <input id="in-fieldset" type="text" />
    </fieldset>
    <div id="log"></div>
    <script>
      // Frameworks listen for `input`, so a fill that sets `.value` without
      // firing it looks like it worked and changes nothing.
      ["text", "email", "area", "editable"].forEach(function (id) {
        document.getElementById(id).addEventListener("input", function () {
          document.getElementById("log").textContent += id + " ";
        });
      });
    </script>
  </body>
</html>
