<!doctype html>
<html>
  <head>
    <title>hoverable</title>
    <style>#target { position: absolute; top: 60px; left: 20px; width: 140px; height: 40px; }</style>
  </head>
  <body>
    <button id="target">Hover me</button>
    <div id="result">not hovered</div>
    <script>
      // Stays where it is. An element that reacts to the pointer by going away
      // is a different fixture, and hovering it is supposed to fail.
      document.getElementById("target").addEventListener("mouseover", function () {
        document.getElementById("result").textContent = "hovered";
      });
    </script>
  </body>
</html>
