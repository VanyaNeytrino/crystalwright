<!doctype html>
<html>
  <head>
    <title>modal</title>
    <style>
      #target { position: absolute; top: 80px; left: 20px; width: 140px; height: 40px; }
      #overlay { position: absolute; top: 0; left: 0; width: 400px; height: 300px; background: rgba(0,0,0,.4); }
      #dialog { position: absolute; top: 60px; left: 10px; width: 300px; height: 120px; background: white; }
    </style>
  </head>
  <body>
    <button id="target">Behind the dialog</button>
    <div id="overlay"><div id="dialog"><p id="dialog-text">Are you sure?</p></div></div>
    <div id="result">not clicked</div>
  </body>
</html>
