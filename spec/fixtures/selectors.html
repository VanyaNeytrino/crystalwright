<!doctype html>
<html>
  <head><title>selectors</title></head>
  <body>
    <div id="root">
      <p class="para">First paragraph</p>
      <p class="para">Second paragraph</p>
      <button data-testid="save">Save changes</button>
      <button id="cancel">Cancel</button>
      <div class="card">
        <span class="label">Total</span>
        <span class="value">42</span>
      </div>
      <input type="submit" value="Submit form" />
      <a href="/next">Go &gt;&gt; there</a>
      <p class="para" style="visibility: hidden">Invisible paragraph</p>
      <p class="para" hidden>Display-none paragraph</p>
    </div>
    <div id="other">
      <button data-testid="save">Save in the other place</button>
    </div>
  </body>
</html>
